<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SunShade </title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" aria-label="Site header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="SunShade home">
        <span class="logo-mark" aria-hidden="true">S</span>
        <span class="logo-text">SunShade</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link" title="Home">Home</a>
        <a href="shop.html" class="nav-link" title="Shop">Shop</a>
        <a href="about.html" class="nav-link" title="About">About</a>
        <a href="contact.html" class="nav-link" title="Contact">Contact</a>
        <a href="cart.html" class="nav-link cart-link" aria-label="Cart">Cart</a>
      </nav>
    </div>
  </header>

  <main class="container main" id="cart-main" aria-label="Shopping cart">
    <h1 class="section-title" style="margin-top:1rem;">Your Cart</h1>
    <div class="cart-table" role="table" aria-label="Cart items">
      <div class="cart-row header">
        <span>Product</span><span>Qty</span><span>Price</span><span>Subtotal</span>
      </div>

      <div class="cart-row" role="row">
        <div class="cell" role="cell">
          <span class="cart-thumb">
            <img src="https://via.placeholder.com/60" alt="Product thumbnail" />
          </span>
          Lumos Shade
        </div>
        <div class="cell" role="cell">
          <input type="number" min="1" value="1" aria-label="Quantity of Lumos Shade" />
        </div>
        <div class="cell" role="cell">$89.99</div>
        <div class="cell" role="cell">$89.99</div>
      </div>

      <div class="cart-row" role="row">
        <div class="cell" role="cell">
          <span class="cart-thumb">
            <img src="https://via.placeholder.com/60" alt="Product thumbnail" />
          </span>
          Astra Classic
        </div>
        <div class="cell" role="cell">
          <input type="number" min="1" value="1" aria-label="Quantity of Astra Classic" />
        </div>
        <div class="cell" role="cell">$74.99</div>
        <div class="cell" role="cell">$74.99</div>
      </div>
    </div>

    <div class="cart-summary" aria-label="Cart summary">
      <p class="subtotal">Subtotal: <strong>$164.98</strong></p>
      <a href="checkout.html" class="btn btn-primary" aria-label="Proceed to checkout">Checkout</a>
    </div>
  </main>

  <footer class="site-footer" aria-label="Site footer">
    <div class="container footer-grid">
      <div class="footer-brand">SunShade</div>
      <nav class="footer-links" aria-label="Footer links">
        <a href="index.html" class="footer-link">Home</a>
        <a href="shop.html" class="footer-link">Shop</a>
        <a href="about.html" class="footer-link">About</a>
        <a href="contact.html" class="footer-link">Contact</a>
      </nav>
      <form class="newsletter" role="form" aria-label="Newsletter signup">
        <label for="cart-email" class="sr-only">Email</label>
        <input id="cart-email" type="email" placeholder="Email address" aria-label="Email address" />
        <button class="btn" type="submit" aria-label="Subscribe">Subscribe</button>
      </form>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 SunShade. All rights reserved.</p>
      <div class="socials" aria-label="Social media">
        <a href="#" class="social-icon" aria-label="Instagram">Instagram</a>
        <a href="#" class="social-icon" aria-label="Facebook">Facebook</a>
      </div>
    </div>
  </footer>
</body>
</html>
