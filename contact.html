<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" aria-label="Site header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="SunShade home">
        <span class="logo-mark" aria-hidden="true">S</span>
        <span class="logo-text"></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link" title="Home"></a>
        <a href="shop.html" class="nav-link" title="Shop">S</a>
        <a href="about.html" class="nav-link" title="About">About</a>
        <a href="contact.html" class="nav-link" title="Contact">Contact</a>
        <a href="cart.html" class="nav-link" aria-label="Cart">Cart</a>
      </nav>
    </div>
  </header>

  <main class="container main" id="contact-main" aria-label="Contact page">
    <h1 class="section-title" style="margin-top:1rem;">Contact Us</h1>
    <form class="contact-form" aria-label="Contact form">
      <div class="form-row">
        <label for="name">Name</label>
        <input id="name" type="text" required />
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" required />
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" rows="5" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit" aria-label="Send message">Send Message</button>
    </form>
  </main>

  <footer class="site-footer" aria-label="Site footer">
    <div class="container footer-grid">
      <div class="footer-brand">SunShade</div>
      <nav class="footer-links" aria-label="Footer links">
        <a href="index.html" class="footer-link">Home</a>
        <a href="shop.html" class="footer-link">Shop</a>
        <a href="about.html" class="footer-link">About</a>
        <a href="contact.html" class="footer-link">Contact</a>
      </nav>
      <form class="newsletter" role="form" aria-label="Newsletter signup">
        <label for="contact-email" class="sr-only">Email</label>
        <input id="contact-email" type="email" placeholder="Email address" aria-label="Email address" />
        <button class="btn" type="submit" aria-label="Subscribe">Subscribe</button>
      </form>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 SunShade. All rights reserved.</p>
      <div class="socials" aria-label="Social media">
        <a href="#" class="social-icon" aria-label="Instagram">Instagram</a>
        <a href="#" class="social-icon" aria-label="Facebook">Facebook</a>
      </div>
    </div>
  </footer>
</body>
</html>
